[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Command line for maze-hex: draws one maze as an SVG file"

[[bin]]
name = "maze-hex"
path = "src/main.rs"

# No crates from crates.io: arguments are parsed by hand so the build works
# offline, and the maze code is the local lib crate.
[dependencies]
lib = { path = "../lib" }
